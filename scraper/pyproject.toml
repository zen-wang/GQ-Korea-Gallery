[project]
name = "gallery-scraper"
version = "0.1.0"
description = "GQ Korea editorial image pipeline: discover -> fetch -> parse -> optimize -> Supabase Storage + Postgres"
requires-python = ">=3.12"
dependencies = [
  "selectolax>=0.3",
  "httpx>=0.27",
  "pillow>=10.4",
  "supabase>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gallery_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
