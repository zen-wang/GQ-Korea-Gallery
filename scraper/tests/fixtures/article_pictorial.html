  so substituting the text costs the tests nothing.

      field empty, and which must be skipped rather than stored as a credit
    - tag_list sitting next to the credit dl list and easily confused with it
    - lazy images: real URL in data-src, src holding a base64 placeholder
    - a non-lazy image whose real URL is in src
    - a lazy image carrying data-src *and* data-srcset, where data-src wins
    - a lazy image carrying only a srcset, the last fallback in _image_url
    - a tracking pixel and a logo that must NOT be collected
    - images outside the body (author avatar, MUST READ module) that must NOT
      be collected — PLAN.md calls this out as the main scoping hazard
    - the same image URL twice in one body
    - two authors, of which the first is the primary byline
-->
